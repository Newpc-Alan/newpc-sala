<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atenção ao professor</title>
<style>
  html, body { margin:0; height:100%; }
  body { display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center;
         background:radial-gradient(circle at 50% 40%, #16406b 0%, #0f2c4a 60%, #0a1f35 100%);
         color:#fff; font-family:"Segoe UI",Roboto,Arial,sans-serif; user-select:none; cursor:default; }
  .icone { width:120px; height:120px; border-radius:50%; background:#1a6b2a; display:flex; align-items:center; justify-content:center;
           box-shadow:0 0 0 14px rgba(26,107,42,.25); margin-bottom:36px; }
  .icone svg { width:56px; height:56px; }
  h1 { font-size:clamp(28px,5vw,52px); margin:0 0 12px; font-weight:700; }
  p { font-size:clamp(16px,2.2vw,22px); margin:0; opacity:.85; }
  #nome { margin-top:28px; font-size:18px; opacity:.7; }
  .marca { position:fixed; bottom:24px; font-size:13px; letter-spacing:1px; opacity:.5; }
</style>
</head>
<body>
  <div class="icone">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
  </div>
  <h1>Atenção ao professor</h1>
  <p>Sua tela foi pausada. Ela volta assim que o professor liberar.</p>
  <div id="nome"></div>
  <div class="marca">NEWPC SALA</div>
<script src="bloqueio.js"></script>
</body>
</html>
