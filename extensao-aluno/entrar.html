<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEWPC Sala · Entrar na aula</title>
<style>
  :root { --verde:#1a6b2a; --azul:#0f2c4a; --azul-2:#16406b; --cinza:#5b6b7a; --borda:#d9e1e8; --erro:#b3261e; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         font-family:"Segoe UI",Roboto,Arial,sans-serif; color:var(--azul);
         background:radial-gradient(circle at 50% 30%, #16406b 0%, #0f2c4a 55%, #0a1f35 100%); }
  .cartao { width:100%; max-width:440px; background:#fff; border-radius:20px; padding:32px 28px 26px;
            box-shadow:0 20px 50px rgba(0,0,0,.35); border-bottom:6px solid var(--verde); }
  .marca { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .logo { width:46px; height:46px; border-radius:11px; background:var(--azul); color:#fff; display:flex; align-items:center;
          justify-content:center; font-weight:800; font-size:24px; border-bottom:4px solid var(--verde); }
  .marca b { display:block; font-size:18px; }
  .marca span { font-size:13px; color:var(--cinza); }
  h1 { font-size:24px; margin:0 0 6px; }
  .sub { margin:0 0 20px; color:var(--cinza); font-size:15px; }
  label { display:block; font-size:12px; font-weight:700; color:var(--cinza); text-transform:uppercase; letter-spacing:.5px; margin:16px 0 6px; }
  input { width:100%; padding:13px 14px; border:2px solid var(--borda); border-radius:12px; font-size:17px; color:var(--azul); }
  input:focus { outline:none; border-color:var(--verde); }
  #codigo { font-size:34px; letter-spacing:10px; text-align:center; font-weight:800; padding:12px; }
  button { width:100%; margin-top:22px; padding:15px; border:0; border-radius:12px; background:var(--verde); color:#fff;
           font-size:17px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .msg { min-height:22px; margin-top:12px; font-size:14px; text-align:center; }
  .msg.erro { color:var(--erro); }
  .conta { margin-top:18px; font-size:12px; color:var(--cinza); text-align:center; word-break:break-all; }
  .ok { text-align:center; padding:10px 0 4px; }
  .ok .check { width:76px; height:76px; border-radius:50%; background:var(--verde); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; }
  .ok .check svg { width:40px; height:40px; }
  .ok strong { display:block; font-size:22px; margin-bottom:6px; }
  .ok p { margin:0; color:var(--cinza); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <main class="cartao">
    <div class="marca">
      <div class="logo">N</div>
      <div><b>NEWPC Sala</b><span>Sala de aula gerenciada</span></div>
    </div>

    <section id="telaForm">
      <h1>Entrar na aula</h1>
      <p class="sub" id="subtitulo">Digite o número que o professor mostrou e o seu nome.</p>
      <label for="codigo">Número da aula</label>
      <input id="codigo" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" autofocus>
      <label for="nome">Seu nome</label>
      <input id="nome" maxlength="60" placeholder="Nome e sobrenome" autocomplete="off">
      <button data-action="entrar" id="btnEntrar">Entrar na aula</button>
      <div class="msg" id="msg"></div>
    </section>

    <section id="telaOk" class="ok" hidden>
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <strong>Você está na aula</strong>
      <p id="okTexto">Pode começar. Esta tela fecha sozinha.</p>
    </section>

    <div class="conta" id="conta"></div>
  </main>
<script src="entrar.js"></script>
</body>
</html>
